<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ProPOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/signIn.css">
</head>
<body>
<div class="auth-container">
    <div class="branding-panel">
        <div class="animated-shapes">
            <div class="shape shape1"></div>
            <div class="shape shape2"></div>
            <div class="shape shape3"></div>
            <div class="shape shape4"></div>
        </div>
        <div class="branding-logo">
            <i class="fas fa-cash-register"></i>
            <span>ProPOS</span>
        </div>
        <div class="branding-text">
            <h1>Welcome Back</h1>
            <p>Manage your sales, inventory, and customers all in one place.</p>
        </div>
    </div>

    <div class="form-panel">
        <div class="theme-switcher">
            <button id="theme-toggle-btn" title="Toggle Theme"><i class="fas fa-sun"></i></button>
        </div>

        <div class="form-header">
            <h2>Sign In</h2>
            <p>Enter your credentials to access your account.</p>
        </div>

        <form action="#">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <input type="text" id="email" class="form-input" placeholder="you@example.com" required>
                    <i class="input-icon fas fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    <i class="input-icon fas fa-lock"></i>
                </div>
            </div>

            <div class="form-actions">
                <div></div> <a href="#" class="form-link">Forgot Password?</a>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <div class="form-footer">
            <p>Don't have an account? <a href="sign-up.html" class="form-link">Sign Up</a></p>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="js/signIn.js"></script>
</body>
</html>
